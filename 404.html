<!DOCTYPE html>
<html lang="es-AR" data-page="404">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página no encontrada | PRIC HOUSE</title>
<meta name="robots" content="noindex" />
<meta name="description" content="La página que buscás no existe o cambió de dirección." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Archivo:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  /* Página 404 — mismo sistema visual del sitio (variables de index.html). */
  :root{
    --carbon:#111315; --bone:#EFEAE2; --copper:#C96B37; --copper-2:#A85A2E;
    --line-on-dark-2:rgba(255,255,255,.16);
    --font-display:'Space Grotesk', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-label:'Archivo', 'Inter', system-ui, sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{min-height:100%;}
  body{
    min-height:100vh; display:flex; flex-direction:column;
    background:var(--carbon); color:#fff; font-family:var(--font-body); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--copper); outline-offset:3px;}
  .top{padding:22px clamp(20px,4vw,48px);}
  .brand{display:inline-flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:600; font-size:14.5px;}
  .logo-plate{background:var(--bone); border-radius:8px; padding:6px 9px; display:inline-flex; line-height:0;}
  .logo-plate img{height:22px; width:auto;}
  main{flex:1; display:flex; align-items:center; padding:40px clamp(20px,4vw,48px) 80px;}
  .box{max-width:640px;}
  .eyebrow{display:flex; align-items:center; gap:14px; font-family:var(--font-label); font-size:12px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--copper); margin-bottom:22px;}
  .eyebrow::before{content:''; width:40px; height:1px; background:var(--copper);}
  h1{font-family:var(--font-display); font-weight:600; font-size:clamp(30px,4.4vw,48px); line-height:1.08; letter-spacing:-.02em; margin-bottom:18px; text-wrap:balance;}
  p{color:rgba(239,234,226,.75); font-size:16px; max-width:52ch;}
  .links{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px;}
  .btn{display:inline-flex; align-items:center; min-height:46px; padding:0 22px; border-radius:999px; border:1px solid var(--line-on-dark-2); font-size:13px; font-weight:600; letter-spacing:.06em; transition:border-color .25s var(--ease), background .25s var(--ease);}
  .btn:hover{border-color:var(--copper); background:rgba(201,107,55,.12);}
  .btn.primary{background:var(--copper); border-color:var(--copper); text-transform:uppercase; letter-spacing:.1em;}
  .btn.primary:hover{background:var(--copper-2); border-color:var(--copper-2);}
</style>
<script src="/js/analytics.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="logo-plate"><img src="/imagenes/logo-pric-house.png" alt="" width="19" height="22" /></span>PRIC HOUSE</a>
  </header>
  <main>
    <div class="box">
      <span class="eyebrow">Error 404</span>
      <h1>No encontramos esta página.</h1>
      <p>Puede que la dirección haya cambiado o que el enlace esté incompleto. Estas son las secciones principales del sitio:</p>
      <nav class="links" aria-label="Secciones principales">
        <a class="btn primary" href="/">Ir al inicio</a>
        <a class="btn" href="/civil/">Civil y Turismo</a>
        <a class="btn" href="/empresas/">Emprendimientos y Empresas</a>
        <a class="btn" href="https://wa.me/5493512142900" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
      </nav>
    </div>
  </main>
</body>
</html>
